name: Update Custom GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */6 * * *" # Updates every 6 hours
  workflow_dispatch:      # Allows manual trigger from the Actions tab
  push:
    branches:
      - main
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: CharmanderTheGreat
        run: python scripts/generate_stats.py

      - name: Commit and push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/*.svg
          git diff --staged --quiet || git commit -m "chore: update custom GitHub stats SVGs"
          git push